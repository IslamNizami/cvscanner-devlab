version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cvscanner-db
    environment:
      POSTGRES_USER: cvuser
      POSTGRES_PASSWORD: cvpassword
      POSTGRES_DB: cvscanner
    ports:
      - "3232:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: